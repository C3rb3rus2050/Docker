[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kest-tool"
version = "1.0.0"
description = "Lokales KESt-Tool (Österreich) für Wertpapierdepots inkl. Broker Document Collector"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Private use" }
dependencies = [
    "streamlit>=1.40,<2",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<0.12",
    "pymupdf>=1.24,<2",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "reportlab>=4.2,<6",
    "playwright>=1.45,<2",
    "pypdf>=4.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
ocr = ["pytesseract>=0.3.10", "pypdfium2>=4.0"]

[project.scripts]
broker-collector = "broker_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kest_tool = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not live'"
markers = [
    "integration: Tests mit lokalem Chromium und Mock-Seiten (keine echten Broker)",
    "live: Echte Broker-Livetests – erfordern manuelle Anmeldung, standardmäßig deaktiviert",
]
