[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "broker-document-collector"
version = "1.0.0"
description = "Lokaler, automatisierter Dokumenten-Sammler für Trade Republic und Scalable Capital"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private use" }
dependencies = [
    "playwright>=1.45,<2",
    "pypdf>=4.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
ocr = ["pytesseract>=0.3.10", "pypdfium2>=4.0"]

[project.scripts]
broker-collector = "broker_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not live'"
markers = [
    "integration: Tests mit lokalem Chromium und Mock-Seiten (keine echten Broker)",
    "live: Echte Broker-Livetests – erfordern manuelle Anmeldung, standardmäßig deaktiviert",
]
