# KESt-Tool – Standardkonfiguration (versioniert)
#
# Eigene Änderungen werden über die Oberfläche (Einstellungen) in config.local.yaml gespeichert
# und überschreiben diese Datei. KEINE Zugangsdaten eintragen – Schlüssel wie password/token/api_key
# werden beim Laden abgelehnt. Optionale API-Schlüssel nur über Umgebungsvariablen (.env, siehe .env.example).

# Zentrale Ablage für Datenbank, Dokumente, Importe, Exporte, Berichte und Logs.
# Achtung: Liegt "Documents" in OneDrive, werden die Dateien in die Cloud synchronisiert.
base_dir: "%USERPROFILE%/Documents/KESt-Tool"

# Steuerjahre, für die Ordner angelegt und die in der Oberfläche angeboten werden.
# Berechnet wird nur, wenn src/kest_tool/data/tax_rules.yaml Regeln für das Jahr enthält.
tax_years: [2022, 2023, 2024, 2025, 2026]
default_tax_year: null      # null = Vorjahr

base_currency: EUR
currencies: [EUR, USD, CHF, GBP, CAD, JPY, DKK, SEK, NOK, AUD]

import:
  date_formats: ["%d.%m.%Y", "%Y-%m-%d", "%d.%m.%y", "%d/%m/%Y", "%Y-%m-%dT%H:%M:%S", "%m/%d/%Y"]
  decimal_separator: auto   # auto | , | .
  max_upload_mb: 50
  allowed_extensions: [".csv", ".txt", ".xlsx", ".xls", ".pdf"]
  fuzzy_duplicate_days: 3
  fuzzy_duplicate_tolerance: 0.005

pdf:
  engine: auto              # auto (pdfplumber, Fallback PyMuPDF) | pdfplumber | pymupdf
  ocr_enabled: false        # optionale lokale Tesseract-OCR (Deutsch/Englisch), Ergebnisse immer prüfen

privacy:
  allow_external_services: false   # es gibt keine Funktion, die Daten an externe Dienste sendet

fx:
  # Fehlende Devisenkurse automatisch mit EZB-Referenzkursen ergänzen. Es wird nur die öffentliche Kursdatei
  # https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist.zip geladen – keine eigenen Daten werden übertragen.
  # false = kein Internetzugriff; die Datei kann dann unter Einstellungen manuell importiert werden.
  auto_fetch: true

prices:
  # Wertpapierkurse (Nichtmeldefonds: erster/letzter Kurs des Jahres; Bewertung zum 31.12.) über EODHD.
  # Benötigt EODHD_API_KEY in .env (Einstellungen → Wertpapierkurse). Übertragen werden nur ISIN/Kürzel und Zeitraum.
  provider: eodhd
  auto_fetch: true
  preferred_exchanges: [XETRA, F, VI, LSE, AS, PA, SW, MI, US]
  # Nichtmeldefonds: zuerst Rücknahmepreise (importiert oder EODHD „EUFUND“, kostenpflichtiges Paket);
  # ohne Rücknahmepreise ersatzweise Börsenschlusskurse (mit Hinweis „kein Rücknahmepreis“).
  nmf_exchange_fallback: true

oekb:
  automatic_provider: none  # kein verifizierter öffentlicher Zugang – siehe README
