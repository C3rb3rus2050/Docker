[server]
# Nur lokal erreichbar – keine Freigabe ins Netzwerk
address = "127.0.0.1"
port = 8501
headless = false
maxUploadSize = 50
enableXsrfProtection = true
enableCORS = true

[browser]
# Keine Nutzungsstatistik an Streamlit senden
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "viewer"

[theme]
font = "sans serif"

# Native selection: Light / Dark / Use system setting, persisted per browser.
[theme.light]
primaryColor = "#c64d08"
backgroundColor = "#f5f5f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#39424e"

[theme.dark]
primaryColor = "#ffad70"
backgroundColor = "#15191f"
secondaryBackgroundColor = "#202630"
textColor = "#e6eaf0"
