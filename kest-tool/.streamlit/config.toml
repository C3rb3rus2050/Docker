[server]
# Nur lokal erreichbar – keine Freigabe ins Netzwerk
address = "127.0.0.1"
port = 8501
headless = false
maxUploadSize = 50
enableXsrfProtection = true
enableCORS = true

[browser]
# Keine Nutzungsstatistik an Streamlit senden
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1863ad"
backgroundColor = "#f6f8fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#18283b"
font = "sans serif"
