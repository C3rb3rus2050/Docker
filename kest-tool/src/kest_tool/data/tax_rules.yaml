# Steuerregeln des KESt-Tools – versioniert nach Steuerjahr
#
# Verifikationsstatus je Regel und Jahr:
#   offiziell_auszug   – durch Auszug aus einer offiziellen Quelle (BMF-Formular, BMF-Findok, RIS, VfGH) bestätigt.
#                        Hinweis: Der Volltext offizieller Seiten war in der Entwicklungsumgebung nicht abrufbar
#                        (Netzwerkrichtlinie); bestätigt wurde über die von der Websuche gelieferten Textauszüge.
#   sekundaer          – nur über Sekundärquellen (Fachkommentar, Kammer, Fachportale) belegt.
#                        Ergebnisse werden berechnet, aber als „vorläufig – prüfen“ markiert.
#   nicht_verifiziert  – keine belastbare Grundlage. Es wird KEIN Betrag berechnet; die Position wird als
#                        „manuell steuerlich zu prüfen“ ausgewiesen.
#
# Für Steuerjahre, die hier nicht hinterlegt sind, verweigert die Anwendung jede Berechnung.
# Werte dürfen nur nach eigener Prüfung der Rechtsgrundlage geändert werden (Quelle + Datum eintragen!).

