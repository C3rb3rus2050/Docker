rules:
  RATE_27_5:
    title: "Besonderer Steuersatz 27,5 % für Kapitaleinkünfte (Dividenden, Fondserträge, realisierte Wertsteigerungen)"
    legal_basis: "§ 27a Abs 1 Z 2 EStG 1988"
    rate: 0.275
    sources: [E1KV_2024, E1KV_2023, E1KV_2022, WKO_KAPITAL_2026]
    status: {2022: offiziell_auszug, 2023: offiziell_auszug, 2024: offiziell_auszug, 2025: sekundaer, 2026: sekundaer}
    logic: "Positive Einkünfte der 27,5-%-Gruppe nach Verlustausgleich × 27,5 %."
    limitations: "Option zur Regelbesteuerung (§ 27a Abs 5) wird nicht berechnet."
    tests: [test_tax_engine.py::test_simple_sale_with_known_cost, test_tax_engine.py::test_years_are_separate]
  RATE_25:
    title: "Besonderer Steuersatz 25 % für Zinsen aus Geldeinlagen/nicht verbrieften Forderungen bei Kreditinstituten"
    legal_basis: "§ 27a Abs 1 Z 1 EStG 1988"
    rate: 0.25
    sources: [E1KV_2024, WKO_KAPITAL_2026]
    status: {2022: sekundaer, 2023: sekundaer, 2024: sekundaer, 2025: sekundaer, 2026: sekundaer}
    logic: "Zinsen ohne ISIN werden als Geldeinlagenzinsen (25 %) vorgeschlagen; Einstufung immer prüfpflichtig."
    limitations: "Ob Zinsen eines Brokers Zinsen aus Geldeinlagen bei einem Kreditinstitut sind, wird nicht geprüft."
    tests: [test_tax_engine.py::test_bank_interest_not_offset_with_losses]
  COST_BASIS_AVERAGE:
    title: "Gleitender Durchschnittspreis je Depot und Wertpapier"
    legal_basis: "§ 27a Abs 4 Z 3 EStG 1988"
    sources: [WP_AK_VO]
    status: {2022: sekundaer, 2023: sekundaer, 2024: sekundaer, 2025: sekundaer, 2026: sekundaer}
    logic: "Anschaffungskosten je Depot+ISIN als Summe/Bestand; Verkauf mindert anteilig."
    limitations: "Depotüberträge, Altbestände (vor 1.4.2012) und pauschale Anschaffungskosten (§ 93 Abs 4) nicht automatisch."
    tests: [test_tax_engine.py::test_moving_average_cost_basis]
  NO_INCIDENTAL_COSTS:
    title: "Anschaffungsnebenkosten/Spesen nicht abzugsfähig (Privatvermögen, Sondersteuersatz)"
    legal_basis: "§ 27a Abs 4 Z 2 EStG; § 20 Abs 2 EStG (Abzugsverbot Werbungskosten)"
    sources: [E1KV_2024, VFGH_2017_G336]
    status: {2022: offiziell_auszug, 2023: offiziell_auszug, 2024: offiziell_auszug, 2025: sekundaer, 2026: sekundaer}
    logic: "Kaufgebühren erhöhen die Anschaffungskosten NICHT; Verkaufsgebühren mindern den Erlös NICHT. Gebühren werden ausgewiesen."
    limitations: "Betriebsvermögen und Kryptowährungen nicht abgedeckt."
    tests: [test_tax_engine.py::test_fees_not_deductible]
  CAPITAL_REPAYMENT:
    title: "Einlagen-/Kapitalrückzahlung mindert Anschaffungskosten; Überschuss = Veräußerungsvorgang"
    legal_basis: "§ 4 Abs 12 EStG 1988"
    sources: [ESTG_4_12]
    status: {2022: sekundaer, 2023: sekundaer, 2024: sekundaer, 2025: sekundaer, 2026: sekundaer}
    logic: "Nur wenn die Buchung ausdrücklich als Kapitalrückzahlung bestätigt ist (Beleg). Sonst ungeklärter Betrag."
    limitations: "Ob eine ausländische Ausschüttung steuerlich eine Einlagenrückzahlung ist, prüft das Tool nicht."
    tests: [test_tax_engine.py::test_capital_repayment_reduces_cost_basis, test_tax_engine.py::test_unverified_capital_repayment_is_unclear]
  LOSS_OFFSET:
    title: "Verlustausgleich innerhalb der Kapitaleinkünfte mit Sondersteuersatz; kein Ausgleich mit 25-%-Bankzinsen/Stiftungszuwendungen; kein Verlustvortrag"
    legal_basis: "§ 27 Abs 8 EStG 1988"
    sources: [LINDE_ESTR_27_8, VFGH_2021_VERLUST, E1KV_2024]
    status: {2022: sekundaer, 2023: sekundaer, 2024: sekundaer, 2025: sekundaer, 2026: sekundaer}
    logic: "Verluste aus realisierten Wertänderungen werden mit positiven 27,5-%-Einkünften desselben Jahres verrechnet; Rest verfällt."
    limitations: "Derivate, Kryptowährungen, Tarifeinkünfte und Stiftungszuwendungen werden nicht verarbeitet."
    tests: [test_tax_engine.py::test_restricted_loss_offset]
  LOSS_OFFSET_ORDER:
    title: "Reihenfolge der Verlustverrechnung (Darstellung)"
    legal_basis: "keine verifizierte gesetzliche Reihenfolge"
    sources: []
    status: {2022: nicht_verifiziert, 2023: nicht_verifiziert, 2024: nicht_verifiziert, 2025: nicht_verifiziert, 2026: nicht_verifiziert}
    logic: "Annahme: Verrechnung zuerst mit Einkünften ohne ausländische Quellensteuer. Nur Darstellung; maßgeblich ist die Veranlagung."
    limitations: "Auswirkung auf die anrechenbare Quellensteuer ist ein Schätzwert."
    tests: [test_tax_engine.py::test_restricted_loss_offset]
  FOREIGN_TAX_CREDIT:
    title: "Anrechnung ausländischer Quellensteuer: höchstens DBA-Satz, höchstens österreichische Steuer auf diese Einkünfte; erstattbare Steuer nicht anrechenbar"
    legal_basis: "E 1kv Erläuterung (Fußnote zu KZ 940/984/998/900/901); jeweiliges DBA"
    sources: [E1KV_2024, FINDOK_DBA_USA]
    status: {2022: offiziell_auszug, 2023: offiziell_auszug, 2024: offiziell_auszug, 2025: sekundaer, 2026: sekundaer}
    logic: "anrechenbar = min(einbehalten, Brutto × DBA-Satz, Brutto × 27,5 %); Rest = nicht anrechenbar (ggf. im Quellenstaat rückforderbar)."
    limitations: "Nur Länder mit hinterlegtem, als verifiziert markiertem DBA-Satz. Sonst ungeklärter Betrag."
    tests: [test_tax_engine.py::test_dividend_with_withholding_tax]
  DOMESTIC_KEST:
    title: "Bereits einbehaltene österreichische KESt (inländische Kapitaleinkünfte) – Anrechnung/Endbesteuerung"
    legal_basis: "§ 97 EStG; E 1kv KZ 899"
    sources: [E1KV_2024]
    status: {2022: offiziell_auszug, 2023: offiziell_auszug, 2024: offiziell_auszug, 2025: sekundaer, 2026: sekundaer}
    logic: "Depots mit KESt-Abzug durch den Broker → Einkünfte gelten als „inländisch“; einbehaltene KESt wird separat ausgewiesen (KZ 899) und nicht doppelt besteuert."
    limitations: "Ob der Broker tatsächlich österreichische KESt abführt, muss je Depot und Jahr bestätigt werden."
    tests: [test_tax_engine.py::test_domestic_kest_not_double_counted]
  MELDEFONDS_AGE:
    title: "Meldefonds: ausschüttungsgleiche Erträge laut OeKB-Meldung; Zufluss zum Meldezeitpunkt; AK-Korrektur"
    legal_basis: "§ 186 Abs 2 Z 1 und Abs 3 InvFG 2011"
    sources: [INVFG_186, BROKERTEST_AGE]
    status: {2022: sekundaer, 2023: sekundaer, 2024: sekundaer, 2025: sekundaer, 2026: sekundaer}
    logic: "AgE = AgE je Anteil × Bestand zum Meldedatum; anrechenbare Steuer je Anteil × Bestand; AK + Korrekturbetrag × Bestand."
    limitations: "Nur mit importierter/erfasster Meldung. Fehlende Meldung → manuelle Prüfung (ggf. Nichtmeldefonds)."
    tests: [test_tax_engine.py::test_meldefonds_age, test_tax_engine.py::test_fund_income_not_double_counted]
  NICHTMELDEFONDS_PAUSCHAL:
    title: "Nichtmeldefonds: pauschale AgE = 90 % des Unterschieds erster/letzter Rücknahmepreis, mindestens 10 % des letzten Rücknahmepreises; Zufluss 31.12."
    legal_basis: "§ 186 Abs 2 Z 3 InvFG 2011"
    sources: [INVFG_186, LINDE_INVFG_186, FINDOK_145784]
    # Ab 2024 wurde § 186 InvFG geändert (BGBl I 111/2023, BGBl I 113/2024). Der Inhalt der geltenden Fassung
    # für Abs 2 Z 3 konnte nicht verifiziert werden → keine Berechnung für 2024+.
    status: {2022: sekundaer, 2023: sekundaer, 2024: nicht_verifiziert, 2025: nicht_verifiziert, 2026: nicht_verifiziert}
    factor_difference: 0.9
    factor_minimum: 0.1
    logic: "je Anteil max(0,9 × (letzter − erster Rücknahmepreis), 0,1 × letzter Rücknahmepreis) × Bestand 31.12.; AK-Erhöhung."
    limitations: "Selbstnachweis, Sonderregel bei fehlendem Rücknahmepreis und unterjährige Veräußerung nicht implementiert."
    tests: [test_tax_engine.py::test_nichtmeldefonds_pauschal_2023, test_tax_engine.py::test_nichtmeldefonds_unverified_year_not_computed]
  NICHTMELDEFONDS_DISTRIBUTIONS:
    title: "Nichtmeldefonds: tatsächliche Ausschüttungen zusätzlich steuerpflichtig (kein Abzug von der Pauschale)"
    legal_basis: "§ 186 Abs 2 Z 3 InvFG 2011"
    sources: [LINDE_INVFG_186]
    status: {2022: sekundaer, 2023: sekundaer, 2024: nicht_verifiziert, 2025: nicht_verifiziert, 2026: nicht_verifiziert}
    logic: "Ausschüttungen eines Nichtmeldefonds = steuerpflichtige Fondsausschüttung."
    limitations: ""
    tests: [test_tax_engine.py::test_meldefonds_vs_nichtmeldefonds]
  REIT_BDC:
    title: "REITs/BDCs: keine automatische Ableitung aus Wertpapierart"
    legal_basis: "Grundsatz: Einstufung nach Rechtsform/Beleg, nicht nach Bezeichnung"
    sources: []
    status: {2022: nicht_verifiziert, 2023: nicht_verifiziert, 2024: nicht_verifiziert, 2025: nicht_verifiziert, 2026: nicht_verifiziert}
    logic: "Ertragsbestandteile werden nur nach bestätigter Klassifizierung je Buchung berücksichtigt, sonst ungeklärt."
    limitations: "Behandlung als ausländischer Immobilienfonds (ImmoInvFG) nicht implementiert."
    tests: [test_tax_engine.py::test_reit_without_classification_is_unclear]
  FX_CONVERSION:
    title: "Umrechnung Fremdwährung in EUR"
    legal_basis: "nicht verifiziert"
    sources: []
    status: {2022: nicht_verifiziert, 2023: nicht_verifiziert, 2024: nicht_verifiziert, 2025: nicht_verifiziert, 2026: nicht_verifiziert}
    logic: "Es wird ausschließlich der im Beleg/vom Benutzer angegebene Kurs verwendet; ohne Kurs kein EUR-Betrag. Positionen in Fremdwährung sind vorläufig."
    limitations: "Keine automatische Kursbeschaffung."
    tests: [test_tax_engine.py::test_missing_data_detected]

