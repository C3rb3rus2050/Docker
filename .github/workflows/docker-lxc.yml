name: Docker LXC validation
on:
  pull_request:
  push:
    branches: [main, feature/lxc-docker-compose, feature/web-only-portal]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r kest-tool/requirements.txt
      - run: python -m compileall -q kest-tool
      - run: python -m pytest -q kest-tool/tests
        env:
          PYTHONPATH: kest-tool/src
  docker-build:
    runs-on: ubuntu-latest
    env:
      PORTAL_PASSWORD_HASH: "$2a$14$examplehashonlyforcomposeconfig000000000000000000000000000"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build
