name: Docker LXC validation
on:
  pull_request:
  push:
    branches: [feature/lxc-docker-compose]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [broker-document-collector, kest-tool]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ${{ matrix.project }}/requirements.txt
      - run: python -m compileall -q ${{ matrix.project }}
      - run: python -m pytest -q ${{ matrix.project }}/tests
        env:
          PYTHONPATH: ${{ matrix.project }}/src
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build
