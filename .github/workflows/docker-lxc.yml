name: Docker LXC validation
on:
  pull_request:
  push:
    branches: [main, feature/lxc-docker-compose, feature/web-only-portal]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r kest-tool/requirements.txt
      - run: python -m compileall -q kest-tool
      - run: python -m pytest -q kest-tool/tests
        env:
          PYTHONPATH: kest-tool/src
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build
      - name: Start the deployment
        run: |
          mkdir -p data/kest
          sudo chown -R 10001:10001 data/kest
          docker compose up -d --wait --wait-timeout 90
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/
          curl --fail http://127.0.0.1:8080/steuer/_stcore/health
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
