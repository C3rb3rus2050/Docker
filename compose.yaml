services:
  portal:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      - kest-tool
    volumes:
      - ./portal/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal/index.html:/srv/index.html:ro
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8080}:8080"

  kest-tool:
    build:
      context: .
    restart: unless-stopped
    environment:
      KEST_TOOL_HOME: /data/kest
    volumes:
      - ./data/kest:/data/kest
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/steuer/api/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

