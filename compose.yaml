services:
  portal:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      - kest-tool
    volumes:
      - ./portal/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal/index.html:/srv/index.html:ro
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8080}:8080"

  kest-tool:
    build:
      context: ./kest-tool
    restart: unless-stopped
    environment:
      KEST_TOOL_HOME: /data/kest
    volumes:
      - ./data/kest:/data/kest
    command: ["python", "-m", "streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--server.baseUrlPath=steuer"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/steuer/_stcore/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

