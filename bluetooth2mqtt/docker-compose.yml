services:
  bluetooth2mqtt:
    build: .
    image: bluetooth2mqtt:latest
    container_name: bluetooth2mqtt
    restart: unless-stopped
    # Host-Netzwerk: MQTT auf localhost erreichbar, Web-Oberfläche auf Port 8099
    network_mode: host
    # Nur für lokalen Bluetooth-Adapter nötig (bei ESPHome-Proxy egal):
    # Docker-Standardprofil von AppArmor blockiert D-Bus
    security_opt:
      - apparmor:unconfined
    environment:
      - TZ=Europe/Vienna
      # Im unprivilegierten LXC: keine UID bei der D-Bus-Anmeldung mitschicken,
      # der Host verwendet dann die tatsächliche (100000)
      - BLEAK_DBUS_AUTH_UID=-1
    volumes:
      - ./data:/app/data            # configuration.json und devices.json
      # Bluetooth über den BlueZ-Dienst des Proxmox-Hosts (im LXC unter /mnt/host-dbus eingehängt).
      # Läuft Docker direkt auf einer Maschine mit eigenem BlueZ: /run/dbus:/run/dbus:ro
      - /mnt/host-dbus:/run/dbus:ro

  # Falls noch kein MQTT-Broker auf dem Server läuft, diesen Block einkommentieren
  # und mosquitto/config/mosquitto.conf anlegen (siehe README):
  # mosquitto:
  #   image: eclipse-mosquitto:2
  #   container_name: mosquitto
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./mosquitto/config:/mosquitto/config
  #     - ./mosquitto/data:/mosquitto/data
