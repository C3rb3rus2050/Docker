services:
  bluetooth2mqtt:
    build: .
    image: bluetooth2mqtt:latest
    container_name: bluetooth2mqtt
    restart: unless-stopped
    # Host-Netzwerk: MQTT auf localhost erreichbar, Web-Oberfläche auf Port 8099
    network_mode: host
    environment:
      - TZ=Europe/Vienna
    volumes:
      - ./data:/app/data            # configuration.json und devices.json
      - /run/dbus:/run/dbus:ro      # Bluetooth über den BlueZ-Dienst des Hosts

  # Falls noch kein MQTT-Broker auf dem Server läuft, diesen Block einkommentieren
  # und mosquitto/config/mosquitto.conf anlegen (siehe README):
  # mosquitto:
  #   image: eclipse-mosquitto:2
  #   container_name: mosquitto
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./mosquitto/config:/mosquitto/config
  #     - ./mosquitto/data:/mosquitto/data
