<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bluetooth2mqtt</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2563eb; --accent-soft: #e8efff; --ok: #16a34a; --bad: #dc2626; --warn: #d97706;
    --warm: #ea580c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --line: #2a313d;
      --accent: #5b8cff; --accent-soft: #1f2a44; --ok: #22c55e; --bad: #f87171; --warn: #fbbf24;
      --warm: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border: 0; padding: 7px 12px; border-radius: 8px; color: var(--muted); font: inherit; cursor: pointer; }
  nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .status { margin-left: auto; display: flex; gap: 8px; font-size: 13px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--bad); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card.offline { opacity: .75; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .name { font-weight: 650; font-size: 16px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  .temps { display: flex; align-items: flex-end; justify-content: space-between; margin: 14px 0 10px; }
  .big { font-size: 34px; font-weight: 300; line-height: 1; }
  .big small { font-size: 15px; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper .val { min-width: 64px; text-align: center; font-size: 20px; font-weight: 600; color: var(--warm); }
  .stepper .val.changed { text-decoration: underline dotted; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 6px 12px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button.round { width: 34px; height: 34px; padding: 0; font-size: 18px; border-radius: 50%; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .fields { display: grid; grid-template-columns: 1fr 96px; gap: 6px 10px; align-items: center; margin-top: 8px; font-size: 14px; }
  input, select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%; }
  .battery.low { color: var(--bad); font-weight: 600; }
  .busy { color: var(--accent); font-size: 13px; }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; }
  .addform { display: grid; grid-template-columns: 1fr 110px auto; gap: 6px; }
  .logs { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .logs div { padding: 3px 0; border-bottom: 1px dashed var(--line); white-space: pre-wrap; word-break: break-word; }
  .lvl-warning { color: var(--warn); } .lvl-error { color: var(--bad); }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; max-width: 90vw; z-index: 5; }
  #toast.error { background: var(--bad); color: #fff; }
  .section-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .section-head h2 { font-size: 17px; margin: 0 auto 0 0; }
  @media (max-width: 560px) { .addform { grid-template-columns: 1fr 1fr; } .addform button { grid-column: span 2; } .status { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>bluetooth<span>2</span>mqtt</h1>
  <nav>
    <button data-tab="devices" class="active">Geräte</button>
    <button data-tab="pair">Anlernen</button>
    <button data-tab="logs">Logs</button>
  </nav>
  <div class="status">
    <span class="pill" id="btInfo">Bluetooth</span>
    <span class="pill"><span class="dot" id="mqttDot"></span>MQTT</span>
    <span class="pill" id="queueInfo">bereit</span>
  </div>
</header>

<main>
  <section id="tab-devices">
    <div class="section-head">
      <h2>Geräte</h2>
      <button id="refreshAll">Alle auslesen</button>
    </div>
    <div class="grid" id="deviceGrid"></div>
  </section>

  <section id="tab-pair" hidden>
    <div class="card">
      <div class="section-head">
        <h2>Neue Geräte suchen</h2>
        <select id="scanTime" style="width:auto">
          <option value="10">10 s</option><option value="20" selected>20 s</option><option value="30">30 s</option>
        </select>
        <button class="primary" id="scanBtn">Suche starten</button>
      </div>
      <p class="muted">Handy-App vorher schließen – die Thermostate erlauben nur eine Verbindung. Beim Hinzufügen
        verbindet sich die Bridge einmal und prüft die PIN (ab Werk 0).</p>
      <div id="scanResults"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2 style="font-size:17px;margin:0 0 10px">Manuell hinzufügen</h2>
      <div class="addform" style="grid-template-columns: 1.3fr 1fr 110px auto">
        <input id="manAddr" placeholder="AA:BB:CC:DD:EE:FF">
        <input id="manName" placeholder="Name, z. B. wohnzimmer">
        <input id="manPin" placeholder="PIN" value="0" inputmode="numeric">
        <button class="primary" id="manAdd">Hinzufügen</button>
      </div>
    </div>
  </section>

  <section id="tab-logs" hidden>
    <div class="card logs" id="logList"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (v, d = 1) => (v === null || v === undefined) ? "–" : Number(v).toFixed(d).replace(".", ",");

let token = localStorage.getItem("b2m_token") || "";
let tab = "devices";
let devices = [];
const pending = {};          // Adresse -> geänderte Solltemperatur (noch nicht gesendet)
const busy = new Set();      // Adressen mit laufender Aktion
const openDetails = new Set();

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.status === 401) {
    const t = prompt("Zugangs-Token der Bridge:");
    if (t !== null) { token = t.trim(); localStorage.setItem("b2m_token", token); return api(method, path, body); }
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg, error = false) {
  const el = $("#toast");
  el.textContent = msg; el.className = error ? "error" : ""; el.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", error ? 6000 : 3000);
}

async function withBusy(address, label, fn) {
  busy.add(address); renderDevices();
  try { const r = await fn(); if (label) toast(label); return r; }
  catch (e) { toast(e.message, true); }
  finally { busy.delete(address); await loadDevices(true); }
}

/* ---------- Tabs ---------- */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
  for (const t of ["devices", "pair", "logs"]) $("#tab-" + t).hidden = t !== tab;
  if (tab === "logs") loadLogs();
  if (tab === "pair") loadScan();
});

/* ---------- Geräte ---------- */
async function loadDevices(force = false) {
  const editing = document.activeElement && document.activeElement.closest && document.activeElement.closest("#deviceGrid input");
  try { devices = await api("GET", "/api/devices"); } catch (e) { return; }
  if (!editing || force) renderDevices();
}

function renderDevices() {
  const grid = $("#deviceGrid");
  if (!devices.length) {
    grid.innerHTML = `<div class="card empty" style="grid-column:1/-1">Noch keine Geräte angelernt.<br><br>
      <button class="primary" onclick="document.querySelector('[data-tab=pair]').click()">Geräte suchen</button></div>`;
    return;
  }
  grid.innerHTML = devices.map(d => {
    const s = d.state || {};
    const a = d.address;
    const sp = pending[a] ?? s.current_heating_setpoint;
    const isBusy = busy.has(a);
    const online = d.available === true, offline = d.available === false;
    const low = s.battery !== null && s.battery !== undefined && s.battery < 20;
    const rw = d.exposes.filter(e => e.access === "rw" && e.name !== "current_heating_setpoint");
    return `
    <div class="card ${offline ? "offline" : ""}" data-addr="${a}">
      <div class="row between">
        <div>
          <div class="name">${esc(d.friendly_name)}</div>
          <div class="mono">${a}</div>
        </div>
        <span class="pill"><span class="dot ${online ? "on" : offline ? "off" : ""}"></span>${online ? "online" : offline ? "offline" : "unbekannt"}</span>
      </div>
      <div class="temps">
        <div><div class="muted">Raum</div><div class="big">${fmt(s.local_temperature)}<small> °C</small></div></div>
        <div>
          <div class="muted" style="text-align:center">Soll</div>
          <div class="stepper">
            <button class="round" data-act="dec" ${isBusy || sp == null ? "disabled" : ""}>−</button>
            <span class="val ${pending[a] !== undefined ? "changed" : ""}">${fmt(sp)} °C</span>
            <button class="round" data-act="inc" ${isBusy || sp == null ? "disabled" : ""}>+</button>
          </div>
        </div>
      </div>
      <div class="row between muted">
        <span class="battery ${low ? "low" : ""}">🔋 ${s.battery ?? "–"} %</span>
        <span>${s.last_seen ? "zuletzt " + new Date(s.last_seen).toLocaleTimeString("de-AT", {hour: "2-digit", minute: "2-digit"}) : "noch nicht gelesen"}</span>
      </div>
      ${pending[a] !== undefined ? `<div class="actions"><button class="primary" data-act="apply" ${isBusy ? "disabled" : ""}>Übernehmen</button><button data-act="discard">Verwerfen</button></div>` : ""}
      ${isBusy ? `<div class="busy" style="margin-top:8px">Verbinde per Bluetooth …</div>` : ""}
      <details ${openDetails.has(a) ? "open" : ""} data-act="details">
        <summary>Einstellungen</summary>
        <div class="fields">
          ${rw.map(e => `<label for="f-${a}-${e.name}">${esc(e.label)}${e.unit ? " (" + e.unit + ")" : ""}</label>
            <input id="f-${a}-${e.name}" type="number" data-field="${e.name}" min="${e.min}" max="${e.max}" step="${e.step}" value="${s[e.name] ?? ""}">`).join("")}
        </div>
        <div class="actions">
          <button data-act="save" ${isBusy ? "disabled" : ""}>Einstellungen speichern</button>
        </div>
        <div class="actions">
          <button data-act="refresh" ${isBusy ? "disabled" : ""}>Auslesen</button>
          <button data-act="rename">Umbenennen</button>
          <button data-act="pin">PIN ändern</button>
          <button class="danger" data-act="remove">Entfernen</button>
        </div>
        <div class="mono" style="margin-top:8px">Topic: bluetooth2mqtt/${esc(d.friendly_name)} · Flags ${esc(s.flags ?? "–")}</div>
      </details>
    </div>`;
  }).join("");
}

$("#deviceGrid").addEventListener("toggle", (ev) => {
  const card = ev.target.closest("[data-addr]");
  if (!card) return;
  ev.target.open ? openDetails.add(card.dataset.addr) : openDetails.delete(card.dataset.addr);
}, true);

$("#deviceGrid").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  const card = btn.closest("[data-addr]");
  const a = card.dataset.addr;
  const d = devices.find(x => x.address === a);
  const name = d.friendly_name;
  const enc = encodeURIComponent(name);
  const s = d.state || {};

  switch (btn.dataset.act) {
    case "inc": case "dec": {
      const cur = pending[a] ?? s.current_heating_setpoint;
      const next = Math.min(28.5, Math.max(7.5, cur + (btn.dataset.act === "inc" ? 0.5 : -0.5)));
      if (next === s.current_heating_setpoint) delete pending[a]; else pending[a] = next;
      renderDevices(); break;
    }
    case "discard": delete pending[a]; renderDevices(); break;
    case "apply": {
      const value = pending[a];
      await withBusy(a, `${name}: Soll ${fmt(value)} °C gesetzt`, async () => {
        await api("POST", `/api/devices/${enc}/set`, { current_heating_setpoint: value });
        delete pending[a];
      });
      break;
    }
    case "save": {
      const changes = {};
      card.querySelectorAll("input[data-field]").forEach(inp => {
        const v = inp.value === "" ? null : Number(inp.value);
        if (v !== null && v !== s[inp.dataset.field]) changes[inp.dataset.field] = v;
      });
      if (!Object.keys(changes).length) { toast("Keine Änderungen"); break; }
      await withBusy(a, `${name}: Einstellungen gespeichert`, () => api("POST", `/api/devices/${enc}/set`, changes));
      break;
    }
    case "refresh":
      await withBusy(a, `${name} ausgelesen`, () => api("POST", `/api/devices/${enc}/refresh`));
      break;
    case "rename": {
      const to = prompt(`Neuer Name für „${name}“:`, name);
      if (!to || to === name) break;
      try { await api("POST", `/api/devices/${enc}/rename`, { to }); toast(`Umbenannt in ${to}`); }
      catch (e) { toast(e.message, true); }
      await loadDevices(true); break;
    }
    case "pin": {
      const pin = prompt(`PIN für „${name}“ (0–999999):`, "0");
      if (pin === null) break;
      try { await api("POST", `/api/devices/${enc}/options`, { pin }); toast("PIN gespeichert, Gerät wird neu ausgelesen"); }
      catch (e) { toast(e.message, true); }
      break;
    }
    case "remove":
      if (!confirm(`„${name}“ wirklich entfernen?`)) break;
      try { await api("DELETE", `/api/devices/${enc}`); toast(`${name} entfernt`); }
      catch (e) { toast(e.message, true); }
      await loadDevices(true); break;
  }
});

$("#refreshAll").onclick = async () => {
  const btn = $("#refreshAll"); btn.disabled = true;
  await Promise.all(devices.map(d => withBusy(d.address, null,
    () => api("POST", `/api/devices/${encodeURIComponent(d.friendly_name)}/refresh`))));
  btn.disabled = false; toast("Alle Geräte ausgelesen");
};

/* ---------- Anlernen ---------- */
let scanData = { devices: [] };

async function loadScan() {
  try { scanData = await api("GET", "/api/scan"); renderScan(); } catch (e) {}
}

function renderScan() {
  const el = $("#scanResults");
  if (scanData.running) { el.innerHTML = `<p class="busy">Suche läuft …</p>`; return; }
  if (!scanData.last_scan) { el.innerHTML = ""; return; }
  if (!scanData.devices.length) {
    el.innerHTML = `<p class="muted">Keine passenden Geräte gefunden. Steht der Server in Reichweite und ist die App geschlossen?</p>`;
    return;
  }
  el.innerHTML = `<table>
    <tr><th>Gerät</th><th>Signal</th><th></th></tr>
    ${scanData.devices.map(r => `<tr data-addr="${r.address}">
      <td><b>${esc(r.name)}</b><div class="mono">${r.address}</div></td>
      <td>${r.rssi} dBm<div class="muted">${r.rssi > -70 ? "gut" : r.rssi > -85 ? "mittel" : "schwach"}</div></td>
      <td>${r.added ? `<span class="muted">angelernt als <b>${esc(r.friendly_name)}</b></span>` :
        `<div class="addform"><input placeholder="Name" data-f="name"><input placeholder="PIN" value="0" data-f="pin" inputmode="numeric"><button class="primary" data-act="add">Hinzufügen</button></div>`}</td>
    </tr>`).join("")}
  </table>`;
}

$("#scanBtn").onclick = async () => {
  const btn = $("#scanBtn"); btn.disabled = true;
  scanData.running = true; renderScan();
  try { scanData = await api("POST", "/api/scan", { time: Number($("#scanTime").value) }); }
  catch (e) { toast(e.message, true); scanData.running = false; }
  btn.disabled = false; renderScan();
};

async function addDevice(address, name, pin, btn) {
  if (!name) { toast("Bitte einen Namen eingeben", true); return; }
  btn.disabled = true; const old = btn.textContent; btn.textContent = "Prüfe Verbindung …";
  try {
    await api("POST", "/api/devices", { address, friendly_name: name, pin });
    toast(`${name} angelernt`);
    await loadScan(); await loadDevices(true);
    return true;
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = old; }
}

$("#scanResults").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-act=add]");
  if (!btn) return;
  const row = btn.closest("tr");
  addDevice(row.dataset.addr, row.querySelector("[data-f=name]").value.trim(), row.querySelector("[data-f=pin]").value, btn);
});

$("#manAdd").onclick = async (ev) => {
  const ok = await addDevice($("#manAddr").value.trim(), $("#manName").value.trim(), $("#manPin").value, ev.target);
  if (ok) { $("#manAddr").value = ""; $("#manName").value = ""; }
};

/* ---------- Logs & Status ---------- */
async function loadLogs() {
  try {
    const lines = await api("GET", "/api/logs");
    $("#logList").innerHTML = lines.length ? lines.slice().reverse().map(l =>
      `<div class="lvl-${l.level}">${esc(l.time)}  ${esc(l.level.toUpperCase().padEnd(7))} ${esc(l.message)}</div>`).join("")
      : `<div class="muted">Noch keine Einträge</div>`;
  } catch (e) {}
}

async function loadInfo() {
  try {
    const i = await api("GET", "/api/info");
    $("#mqttDot").className = "dot " + (i.mqtt_connected ? "on" : "off");
    $("#btInfo").textContent = i.bluetooth || "Bluetooth";
    $("#queueInfo").textContent = i.scan_running ? "Suche läuft" : i.queue ? `${i.queue} in Warteschlange` : "bereit";
  } catch (e) {}
}

async function tick() {
  await loadInfo();
  if (document.hidden) return;
  if (tab === "devices" && !busy.size) await loadDevices();
  if (tab === "logs") await loadLogs();
}

loadDevices(true); loadInfo();
setInterval(tick, 5000);
</script>
</body>
</html>
