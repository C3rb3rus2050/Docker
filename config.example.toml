# Broker Document Collector – Beispielkonfiguration
# Kopie als config.toml anlegen (install.bat erledigt das automatisch).
#
# WICHTIG: Hier werden KEINE Zugangsdaten eingetragen. Schlüssel wie password, pin, token,
# cookie oder session werden beim Laden abgelehnt. Die Anmeldung erfolgt ausschließlich
# selbst im sichtbaren Browserfenster.

# Ausgabeordner für Dokumente, Datenbank, Logs und Berichte.
# Achtung: Liegt "Dokumente" in OneDrive, werden die Dateien in die Cloud synchronisiert!
# Dann einen lokalen Ordner wählen, z. B. "D:/Daten/BrokerDocumentCollector".
output_dir = "%USERPROFILE%/Documents/BrokerDocumentCollector"

# Browserprofile (enthalten Sitzungscookies = Zugangsschlüssel). Standard: %LOCALAPPDATA%
profile_dir = "%LOCALAPPDATA%/BrokerDocumentCollector/browser-profile"

# Klassifizierung
pdf_text_extraction = true
ocr_enabled = false          # lokale OCR (Tesseract) für gescannte PDFs; optional
tesseract_cmd = ""           # z. B. "C:/Program Files/Tesseract-OCR/tesseract.exe"

# Download-Engine
max_download_mb = 100
download_timeout_s = 90
retry_attempts = 3
retry_backoff_s = 2.0

# Discovery-Grenzen (Schutz vor Endlosschleifen)
max_pages_per_area = 200
max_load_more_clicks = 500
max_areas = 60
max_items_per_area = 5000
action_delay_ms = 600

# Browser: "" = mitgeliefertes Playwright-Chromium, alternativ "msedge" oder "chrome"
browser_channel = ""
browser_executable = ""
login_wait_timeout_s = 600

# Zweite Quellen für den Abgleich
trade_republic_websocket = true   # inoffizielle TR-Schnittstelle, nur im angemeldeten Browser, nur lesend
network_capture = true            # von der Webapp selbst geladene Dokumentlisten passiv mitlesen
extra_document_hosts = ""         # nur offizielle Speicherorte des Brokers, kommagetrennt

# Oberfläche (nur lokal erreichbar)
ui_port = 8765
open_browser_ui = true

# Sync-Modus: bereits ausgewertete Timeline-Einträge erneut prüfen
recheck_old_areas = false
